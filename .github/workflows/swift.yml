name: 1. 编译 Tvbox Archive (未签名)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    runs-on: macos-15

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 选择系统预装的 Xcode 16
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer || true
          xcodebuild -version

      # 3. 安装 XcodeGen 并降级 project.pbxproj 的格式（防止 77 格式报错）
      - name: Install & Run XcodeGen
        run: |
          brew install xcodegen
          
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

          # 将 objectVersion 77 强制改为 60，避免旧工具链拒绝读取
          find . -name "project.pbxproj" -exec sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' {} +

      # 4. 创建 Dummy 密钥文件与占位描述文件 (欺骗 package_ios.sh)
      - name: Create Dummy Secrets & Provision Profile
        run: |
          mkdir -p IOS-key
          
          cat << 'EOF' > IOS-key/secrets.sh
          #!/bin/bash
          echo "Bypassing secrets.sh check..."
          EOF
          chmod +x IOS-key/secrets.sh

          touch IOS-key/cert.mobileprovision

      # 5. 【关键修复】设置环境变量，跳过平台缺失校验并运行 package_ios.sh
      - name: Run Package Script
        env:
          # 告诉 xcodebuild 忽略缺少特定版本 SDK 的警告并继续构建
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/CI.xcconfig
        run: |
          # 动态创建一个临时 xcconfig 覆盖跳过签名和SDK缺失校验
          cat << 'EOF' > CI.xcconfig
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY = 
          COMPILER_INDEX_STORE_ENABLE = NO
          EOF

          chmod +x package_ios.sh

          # 传入 SDK 平台参数运行脚本
          ./package_ios.sh -sdk iphoneos ALLOW_INELIGIBLE_PLATFORMS=YES

      # 6. 上传 xcarchive 产物
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-xcarchive
          path: |
            *.xcarchive
            build/*.xcarchive
            ~/Library/Developer/Xcode/Archives/*/*.xcarchive
          retention-days: 1
