name: 编译 TVBox 并直接导出 SideStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-export:
    runs-on: macos-15

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 切换到系统的 Xcode 16.0
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      # 3. 安装必备工具
      - name: Install Build Tools
        run: brew install xcodegen xcbeautify

      # 4. 激活 CoreSimulator 服务
      - name: Boot CoreSimulator Service
        run: |
          sudo xcodebuild -runFirstLaunch
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.CoreSimulator.CoreSimulatorService.plist 2>/dev/null || true
          xcrun simctl list devices || true

      # 5. 缓存 iOS Platform
      - name: Cache iOS Platform Runtime
        id: cache-ios-platform
        uses: actions/cache@v4
        with:
          path: |
            /Library/Developer/CoreSimulator/Profiles/Runtimes
            ~/Library/Caches/com.apple.dt.XCode
          key: ${{ runner.os }}-xcode16-ios-platform-v1

      # 6. 未命中缓存时进行下载
      - name: Force Download iOS Platform (Only on Cache Miss)
        if: steps.cache-ios-platform.outputs.cache-hit != 'true'
        run: |
          export XCODE_BUILD_SYSTEM_SUPPORT_PARALLEL_DOWNLOADS=YES
          sudo xcodebuild -downloadPlatform iOS -quiet || sudo xcodebuild -downloadAllPlatforms -quiet || true

      # 7. 运行 XcodeGen 生成工程
      - name: Run XcodeGen
        run: xcodegen generate

      # 8. 创建 macOS entitlements 占位文件
      - name: Fix Missing Entitlements File
        run: |
          mkdir -p tvbox
          touch tvbox/tvbox-macOS.entitlements

      # 9. 解析 SPM 依赖包
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project tvbox.xcodeproj \
            -scheme "tvbox"

      # 10. 执行编译归档
      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme "tvbox" \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/TVBox.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=targeted \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO | xcbeautify

      # 11. 【核心新增】直接在当前任务中提取 .app 并打包为 SideStore 专属 .ipa
      - name: Package IPA for SideStore
        run: |
          mkdir -p $RUNNER_TEMP/IPA/Payload
          APP_PATH=$(find $RUNNER_TEMP/TVBox.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "找到应用路径: $APP_PATH"
          cp -R "$APP_PATH" $RUNNER_TEMP/IPA/Payload/
          cd $RUNNER_TEMP/IPA
          zip -qr $RUNNER_TEMP/TVBox_SideStore.ipa Payload
          echo "IPA 打包成功！"

      # 12. 上传最终的 .ipa 文件到 Artifacts
      - name: Upload SideStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_SideStore.ipa
          path: ${{ runner.temp }}/TVBox_SideStore.ipa
          retention-days: 7
