name: 1. 编译 Tvbox Archive (精修 MainActor 隔离版)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    runs-on: macos-14

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 选择稳定的 Xcode 15.4 环境
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      # 3. 安装必备工具
      - name: Install Build Tools
        run: brew install xcodegen xcbeautify

      # 4. 【核心修复】精准修补代码中的 await 缺失与 MainActor 隔离报错
      - name: Auto Patch Swift Code Errors
        run: |
          # 1. 移除 Xcode 16 专有的 @retroactive 关键字
          find tvbox -name "*.swift" -exec sed -i '' 's/@retroactive //g' {} +

          # 2. 补全 ImageCache 和 CacheStore 中遗漏的 await 关键字
          find tvbox -name "*.swift" -exec sed -i '' 's/ImageCache.shared.get(/await ImageCache.shared.get(/g' {} +
          find tvbox -name "*.swift" -exec sed -i '' 's/ImageCache.shared.set(/await ImageCache.shared.set(/g' {} +
          find tvbox -name "*.swift" -exec sed -i '' 's/CacheStore.shared.clearHistory(/await CacheStore.shared.clearHistory(/g' {} +
          find tvbox -name "*.swift" -exec sed -i '' 's/await await/await/g' {} +

          # 3. 精准给所有 PlayerView / VLCPlayerView / PlayerController 中的关键清理方法添加 @MainActor
          find tvbox -name "*.swift" -exec sed -i '' 's/func cleanUp/@MainActor func cleanUp/g' {} +
          find tvbox -name "*.swift" -exec sed -i '' 's/func cleanup/@MainActor func cleanup/g' {} +
          find tvbox -name "*.swift" -exec sed -i '' 's/func resetPlayer/@MainActor func resetPlayer/g' {} +
          find tvbox -name "*.swift" -exec sed -i '' 's/func stopPlayer/@MainActor func stopPlayer/g' {} +
          find tvbox -name "*.swift" -exec sed -i '' 's/func dismantleUIView/@MainActor static func dismantleUIView/g' {} +

      # 5. 运行 XcodeGen 生成工程
      - name: Run XcodeGen
        run: xcodegen generate

      # 6. 将工程格式降低到 60 (解决 ObjectVersion 77 报错)
      - name: Downgrade Xcode Project Format
        run: |
          find tvbox.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' {} +

      # 7. 创建 macOS entitlements 占位文件
      - name: Fix Missing Entitlements File
        run: |
          mkdir -p tvbox
          touch tvbox/tvbox-macOS.entitlements

      # 8. 解析 SPM 依赖包 (VLCKitSPM)
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project tvbox.xcodeproj \
            -scheme "tvbox"

      # 9. 执行归档编译
      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme "tvbox" \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/TVBox.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=targeted \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO | xcbeautify

      # 10. 上传编译产物暂存
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tvbox-xcarchive
          path: ${{ runner.temp }}/TVBox.xcarchive
          retention-days: 1
