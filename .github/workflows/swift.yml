name: 1. 编译 Tvbox Archive (未签名)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    # 切换到支持 Xcode 16+ 的 macos-15 镜像
    runs-on: macos-15

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 确保使用 Xcode 16
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer || true
          xcodebuild -version

      # 3. 安装 XcodeGen 并降级转换 pbxproj 格式
      - name: Install & Run XcodeGen
        run: |
          brew install xcodegen
          
          # 如果项目有 project.yml，使用 xcodegen 重新渲染工程
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

          # 【关键修正】将 project.pbxproj 里的 objectVersion 77 强制降级替换为 60 (Xcode 15/16 通用)
          find . -name "project.pbxproj" -exec sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' {} +

      # 4. 创建 Dummy 密钥和描述文件 (欺骗 package_ios.sh 的 cp/check 检查)
      - name: Create Dummy Secrets & Provision Profile
        run: |
          mkdir -p IOS-key
          
          cat << 'EOF' > IOS-key/secrets.sh
          #!/bin/bash
          echo "Bypassing secrets.sh check..."
          EOF
          chmod +x IOS-key/secrets.sh

          touch IOS-key/cert.mobileprovision

      # 5. 运行打包脚本
      - name: Run Package Script
        run: |
          chmod +x package_ios.sh
          ./package_ios.sh

      # 6. 上传 xcarchive 产物
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-xcarchive
          path: |
            *.xcarchive
            build/*.xcarchive
            ~/Library/Developer/Xcode/Archives/*/*.xcarchive
          retention-days: 1
