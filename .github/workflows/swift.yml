name: 1. 编译 Tvbox Archive (对齐系统 iOS 18.5 现成 Platform)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    runs-on: macos-15

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 选择系统的 Xcode
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      # 3. 安装必备工具
      - name: Install Build Tools
        run: brew install xcodegen xcbeautify

      # 4. 【关键对齐】修改 project.yml 中的版本号为系统现成的 18.5 / 16.0
      - name: Patch project.yml to match System Runtime
        run: |
          if [ -f "project.yml" ]; then
            sed -i '' 's/deploymentTarget: .*/deploymentTarget: "18.5"/g' project.yml
            sed -i '' 's/iOS: .*/iOS: "18.5"/g' project.yml
          fi

      # 5. 运行 XcodeGen 生成工程
      - name: Run XcodeGen
        run: xcodegen generate

      # 6. 【扫荡修补】把 pbxproj 中写死的 18.0 全部替换为 18.5
      - name: Align pbxproj to iOS 18.5
        run: |
          find tvbox.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.5;/g' {} +
          find tvbox.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/iphoneos18.0/iphoneos18.5/g' {} +

      # 7. 创建 macOS entitlements 占位文件
      - name: Fix Missing Entitlements File
        run: |
          mkdir -p tvbox
          touch tvbox/tvbox-macOS.entitlements

      # 8. 解析 SPM 依赖包 (VLCKitSPM)
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project tvbox.xcodeproj \
            -scheme "tvbox"

      # 9. 执行归档编译（瞬间命中 iOS 18.5 现有平台）
      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme "tvbox" \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/TVBox.xcarchive \
            -configuration Release \
            IPHONEOS_DEPLOYMENT_TARGET=18.5 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=targeted \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO | xcbeautify

      # 10. 上传编译产物暂存
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tvbox-xcarchive
          path: ${{ runner.temp }}/TVBox.xcarchive
          retention-days: 1
