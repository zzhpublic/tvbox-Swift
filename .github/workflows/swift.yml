name: 编译 TVBox 并导出修复网络权限的 SideStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-export:
    runs-on: macos-15

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 切换到系统的 Xcode 16.0
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      # 3. 安装必备工具
      - name: Install Build Tools
        run: brew install xcodegen xcbeautify

      # 4. 激活 CoreSimulator 服务
      - name: Boot CoreSimulator Service
        run: |
          sudo xcodebuild -runFirstLaunch
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.CoreSimulator.CoreSimulatorService.plist 2>/dev/null || true
          xcrun simctl list devices || true

      # 5. 缓存 iOS Platform
      - name: Cache iOS Platform Runtime
        id: cache-ios-platform
        uses: actions/cache@v4
        with:
          path: |
            /Library/Developer/CoreSimulator/Profiles/Runtimes
            ~/Library/Caches/com.apple.dt.XCode
          key: ${{ runner.os }}-xcode16-ios-platform-v1

      # 6. 未命中缓存时进行下载
      - name: Force Download iOS Platform (Only on Cache Miss)
        if: steps.cache-ios-platform.outputs.cache-hit != 'true'
        run: |
          export XCODE_BUILD_SYSTEM_SUPPORT_PARALLEL_DOWNLOADS=YES
          sudo xcodebuild -downloadPlatform iOS -quiet || sudo xcodebuild -downloadAllPlatforms -quiet || true

      # 7. 运行 XcodeGen 生成工程
      - name: Run XcodeGen
        run: xcodegen generate

      # 8. 生成包含完整网络权限的 Entitlements 文件
      - name: Inject Network Entitlements
        run: |
          mkdir -p tvbox
          cat <<EOF > tvbox/tvbox-iOS.entitlements
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.network.client</key>
              <true/>
              <key>com.apple.security.network.server</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF

      # 9. 解析 SPM 依赖包
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project tvbox.xcodeproj \
            -scheme "tvbox"

      # 10. 执行编译归档
      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme "tvbox" \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/TVBox.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=targeted \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO | xcbeautify

      # 11. 注入网络权限 + 补充 ATS 解禁 + 执行 Ad-hoc 伪签名与打包
      - name: Fix Network Permissions & Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/IPA/Payload
          APP_PATH=$(find $RUNNER_TEMP/TVBox.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "找到应用路径: $APP_PATH"
          
          # 拷贝 .app 到 Payload 目录
          cp -R "$APP_PATH" $RUNNER_TEMP/IPA/Payload/
          TARGET_APP="$RUNNER_TEMP/IPA/Payload/$(basename "$APP_PATH")"

          # 11.1 强制写入 ATS (Allow Arbitrary Loads) 与网络权限描述到 Info.plist
          PLIST="$TARGET_APP/Info.plist"
          plutil -insert NSAppTransportSecurity -xml "<dict><key>NSAllowsArbitraryLoads</key><true/></dict>" "$PLIST" 2>/dev/null || \
          plutil -replace NSAppTransportSecurity -xml "<dict><key>NSAllowsArbitraryLoads</key><true/></dict>" "$PLIST"
          
          plutil -replace NSLocalNetworkUsageDescription -string "TVBox 需要访问网络以播放资源" "$PLIST"

          # 11.2 创建伪签名所需的 Entitlements plist
          cat <<EOF > $RUNNER_TEMP/entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.network.client</key>
              <true/>
              <key>com.apple.security.network.server</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 11.3 强制给 Dynamic Frameworks 库和主 App 赋予本地 Ad-hoc 签名与网络 Capability
          if [ -d "$TARGET_APP/Frameworks" ]; then
            find "$TARGET_APP/Frameworks" -type f \( -name "*.framework" -o -name "*.dylib" \) -exec codesign --force --sign - --timestamp=none {} + 2>/dev/null || true
          fi
          codesign --force --sign - --entitlements $RUNNER_TEMP/entitlements.plist --timestamp=none "$TARGET_APP"

          # 11.4 压包为 IPA
          cd $RUNNER_TEMP/IPA
          zip -qr $RUNNER_TEMP/TVBox_SideStore.ipa Payload
          echo "==== 修复网络权限后的 IPA 制作完成 ===="

      # 12. 【核心校验步骤】自动检测产物 IPA 的网络权限注入状态
      - name: Verify IPA Network Permissions
        run: |
          APP_PATH=$(find $RUNNER_TEMP/IPA/Payload -name "*.app" | head -n 1)
          
          echo "=========================================="
          echo "🔍 1. 检查 Info.plist 内部网络 ATS 属性:"
          echo "=========================================="
          plutil -p "$APP_PATH/Info.plist" | grep -A 4 "NSAppTransportSecurity" || echo "⚠️ 未找到 ATS 配置"
          
          echo ""
          echo "=========================================="
          echo "🔍 2. 检查二进制 App 的签名 Entitlements:"
          echo "=========================================="
          codesign -d --entitlements :- "$APP_PATH" || echo "⚠️ 签名二进制没有读取到 Entitlements"
          echo "=========================================="

      # 13. 上传最终的 .ipa 文件
      - name: Upload SideStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_SideStore.ipa
          path: ${{ runner.temp }}/TVBox_SideStore.ipa
          retention-days: 7
