name: 1. 编译 Tvbox Archive (未签名)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持手动触发

jobs:
  build-archive:
    runs-on: macos-14

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 安装 XcodeGen
      - name: Install XcodeGen
        run: brew install xcodegen

      # 3. 创建 IOS-key 文件夹及各种 Dummy 占位文件
      - name: Create Dummy Secrets & Provision Profile
        run: |
          mkdir -p IOS-key
          
          # 生成 dummy secrets.sh
          cat << 'EOF' > IOS-key/secrets.sh
          #!/bin/bash
          echo "Bypassing secrets.sh check for GitHub Actions CI..."
          EOF
          chmod +x IOS-key/secrets.sh

          # 生成 dummy cert.mobileprovision 骗过 cp 脚本
          touch IOS-key/cert.mobileprovision

      # 4. 运行项目打包脚本生成 .xcarchive
      - name: Run Package Script
        run: |
          chmod +x package_ios.sh
          ./package_ios.sh

      # 5. 提取生成的 .xcarchive 并打包上传暂存
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-xcarchive
          path: |
            *.xcarchive
            build/*.xcarchive
            ~/Library/Developer/Xcode/Archives/*/*.xcarchive
          retention-days: 1 # 暂存 1 天
