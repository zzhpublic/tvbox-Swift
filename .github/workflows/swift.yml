name: 1. 编译 Tvbox Archive (真实在线下载挂载 iOS 18 Platform)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    runs-on: macos-15

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 切换到系统自带的 Xcode 16.0
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      # 3. 安装必备工具
      - name: Install Build Tools
        run: brew install xcodegen xcbeautify

      # 4. 【核心修复】使用 Xcode 16 标准语法强行触发 iOS Platform 下载与挂载
      - name: Force Download & Install iOS Platform
        run: |
          echo "==== 1. 初始化 Xcode 运行环境与 CoreSimulator 服务 ===="
          sudo xcodebuild -runFirstLaunch
          sudo killall com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
          
          echo "==== 2. 发起 iOS Platform 的静默下载与挂载 ===="
          export XCODE_BUILD_SYSTEM_SUPPORT_PARALLEL_DOWNLOADS=YES
          
          # 正确的标准语法：不加任何不支持的 -buildVersion 参数，开启 quiet 静默拉取
          sudo xcodebuild -downloadPlatform iOS -quiet || sudo xcodebuild -downloadAllPlatforms || true
          
          echo "==== 3. 校验 SDK 与 Runtime 挂载状态 ===="
          xcodebuild -showsdks
          xcrun simctl list runtimes || true

      # 5. 运行 XcodeGen 生成工程
      - name: Run XcodeGen
        run: xcodegen generate

      # 6. 创建 macOS entitlements 占位文件
      - name: Fix Missing Entitlements File
        run: |
          mkdir -p tvbox
          touch tvbox/tvbox-macOS.entitlements

      # 7. 解析 SPM 依赖包 (VLCKitSPM)
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project tvbox.xcodeproj \
            -scheme "tvbox"

      # 8. 执行归档编译
      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme "tvbox" \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/TVBox.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=targeted \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO | xcbeautify

      # 9. 上传编译产物暂存
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tvbox-xcarchive
          path: ${{ runner.temp }}/TVBox.xcarchive
          retention-days: 1
