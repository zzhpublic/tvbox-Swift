name: 1. 编译 Tvbox Archive (抓取Swift精准报错)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    runs-on: macos-14

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 选择稳定的 Xcode 15.4 环境
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      # 3. 安装 xcbeautify 日志格式化工具与 XcodeGen
      - name: Install Build Tools
        run: brew install xcodegen xcbeautify

      # 4. 运行 XcodeGen 生成工程
      - name: Run XcodeGen
        run: xcodegen generate

      # 5. 降级工程格式 (解决 objectVersion 77 问题)
      - name: Downgrade xcodeproj Format
        run: |
          find tvbox.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' {} +

      # 6. 创建 macOS entitlements 占位文件
      - name: Fix Missing Entitlements File
        run: |
          mkdir -p tvbox
          touch tvbox/tvbox-macOS.entitlements

      # 7. 解析 SPM 依赖包 (VLCKitSPM)
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project tvbox.xcodeproj \
            -scheme "tvbox"

      # 8. 编译 Archive 并在失败时精确打印 Swift 报错行
      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme "tvbox" \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/TVBox.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO | xcbeautify

      # 9. 上传编译产物暂存
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tvbox-xcarchive
          path: ${{ runner.temp }}/TVBox.xcarchive
          retention-days: 1
