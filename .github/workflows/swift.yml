name: 1. 编译 Tvbox Archive (未签名)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    # 降回使用最稳妥的 macos-14 环境 (内置已安装齐全的 iOS SDK)
    runs-on: macos-14

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 选择稳定的 Xcode 15.4 环境
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      # 3. 安装 XcodeGen 并降级 project.pbxproj 的格式（解决 ObjectVersion 77 问题）
      - name: Install & Run XcodeGen
        run: |
          brew install xcodegen
          
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

          # 强制将 77 格式降级为 60，避免 Xcode 15 拒读
          find . -name "project.pbxproj" -exec sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' {} +

      # 4. 【关键步骤】直接用原生 xcodebuild 打包，完全绕过 package_ios.sh
      - name: Build Archive Directly
        run: |
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme "tvbox" \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/tvbox.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      # 5. 上传生成的 tvbox.xcarchive 归档文件
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-xcarchive
          path: ${{ runner.temp }}/tvbox.xcarchive
          retention-days: 1
