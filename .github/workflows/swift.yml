name: 1. 编译 Tvbox Archive (未签名)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持手动触发

jobs:
  build-archive:
    runs-on: macos-14

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 安装 XcodeGen（如果项目用到了 xcodeproj 生成）
      - name: Install XcodeGen
        run: brew install xcodegen

      # 3. 运行项目自带的打包脚本生成 .xcarchive
      - name: Run Package Script
        run: |
          chmod +x package_ios.sh
          ./package_ios.sh

      # 4. 提取生成的 .xcarchive 并打包上传暂存
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-xcarchive
          # 假设脚本在根目录或 build 目录下生成了 xcarchive
          path: |
            *.xcarchive
            build/*.xcarchive
          retention-days: 1 # 暂存 1 天

