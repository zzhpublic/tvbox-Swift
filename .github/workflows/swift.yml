name: 1. 编译 Tvbox Archive (彻底粉碎 iOS 18.0 强绑定)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    runs-on: macos-15

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 选择系统的 Xcode 16.0
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      # 3. 安装必备工具
      - name: Install Build Tools
        run: brew install xcodegen xcbeautify

      # 4. 【绝杀 1】预先清理 project.yml 里的所有强约束
      - name: Patch project.yml
        run: |
          if [ -f "project.yml" ]; then
            # 删掉所有可能写死 18.0 的行
            sed -i '' '/deploymentTarget:/d' project.yml
            sed -i '' '/sdk:/d' project.yml
            # 统一注入 iOS 17.0 作为通用兼容基准
            echo "options:" >> project.yml
            echo "  deploymentTarget:" >> project.yml
            echo "    iOS: \"17.0\"" >> project.yml
          fi

      # 5. 运行 XcodeGen 生成工程
      - name: Run XcodeGen
        run: xcodegen generate

      # 6. 【绝杀 2】暴力扫荡工程文件，把所有残余的 18.0 / iphoneos18.0 彻底清除
      - name: Force Purge 18.0 references in pbxproj
        run: |
          echo "==== 开始强制粉碎 pbxproj 中的 18.0 标记 ===="
          find tvbox.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/iphoneos18\.0/iphoneos/g' {} +
          find tvbox.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/iphoneos18\.[0-9]/iphoneos/g' {} +
          find tvbox.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 18\.0;/IPHONEOS_DEPLOYMENT_TARGET = 17.0;/g' {} +
          find tvbox.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/SDKROOT = iphoneos18\.0;/SDKROOT = iphoneos;/g' {} +

      # 7. 创建 macOS entitlements 占位文件
      - name: Fix Missing Entitlements File
        run: |
          mkdir -p tvbox
          touch tvbox/tvbox-macOS.entitlements

      # 8. 解析 SPM 依赖包 (VLCKitSPM)
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project tvbox.xcodeproj \
            -scheme "tvbox"

      # 9. 【绝杀 3】通过覆盖环境变量，强制让 xcodebuild 采用通用 SDK
      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme "tvbox" \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/TVBox.xcarchive \
            -configuration Release \
            SDKROOT=iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=targeted \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO | xcbeautify

      # 10. 上传编译产物暂存
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tvbox-xcarchive
          path: ${{ runner.temp }}/TVBox.xcarchive
          retention-days: 1
