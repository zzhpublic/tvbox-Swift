name: 1. 编译 Tvbox Archive (未签名)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    runs-on: macos-14

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 切换到支持更高版本格式的 Xcode
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      # 3. 安装 XcodeGen 并重新生成工程
      - name: Install & Run XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate # 重新生成兼容当前 Xcode 的 pbxproj

      # 4. 创建 Dummy 密钥和描述文件 (欺骗 package_ios.sh 的检查)
      - name: Create Dummy Secrets & Provision Profile
        run: |
          mkdir -p IOS-key
          
          cat << 'EOF' > IOS-key/secrets.sh
          #!/bin/bash
          echo "Bypassing secrets.sh check..."
          EOF
          chmod +x IOS-key/secrets.sh

          touch IOS-key/cert.mobileprovision

      # 5. 运行打包脚本
      - name: Run Package Script
        run: |
          chmod +x package_ios.sh
          ./package_ios.sh

      # 6. 上传 xcarchive 产物
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-xcarchive
          path: |
            *.xcarchive
            build/*.xcarchive
            ~/Library/Developer/Xcode/Archives/*/*.xcarchive
          retention-days: 1
