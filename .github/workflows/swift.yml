name: 1. 编译 Tvbox Archive (带永久 Runtime 缓存版)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-archive:
    runs-on: macos-15

    steps:
      # 1. 检出仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 切换到系统的 Xcode 16.0
      - name: Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      # 3. 安装必备工具
      - name: Install Build Tools
        run: brew install xcodegen xcbeautify

      # 4. 初始化 Xcode 首次运行环境
      - name: Setup Xcode First Launch
        run: |
          sudo xcodebuild -runFirstLaunch

      # 5. 【核心点】永久缓存 iOS 18 Platform Runtime 目录
      # 只要缓存命中，瞬间跳过下载；未命中则下载一次并自动永久保存
      - name: Cache iOS 18 Platform Runtime
        id: cache-ios-runtime
        uses: actions/cache@v4
        with:
          path: |
            /Library/Developer/CoreSimulator/Profiles/Runtimes
            ~/Library/Caches/com.apple.dt.XCode
          key: ${{ runner.os }}-xcode16-ios18-runtime-v1

      # 6. 当缓存未命中时，才执行下载（下载一次后自动缓存）
      - name: Download iOS 18 Platform (Only when cache missed)
        if: steps.cache-ios-runtime.outputs.cache-hit != 'true'
        run: |
          echo "==== 未找到缓存，开始首次下载 iOS 18 Platform ===="
          export XCODE_BUILD_SYSTEM_SUPPORT_PARALLEL_DOWNLOADS=YES
          sudo xcodebuild -downloadPlatform iOS -quiet || true

      # 7. 运行 XcodeGen 生成工程
      - name: Run XcodeGen
        run: xcodegen generate

      # 8. 创建 macOS entitlements 占位文件
      - name: Fix Missing Entitlements File
        run: |
          mkdir -p tvbox
          touch tvbox/tvbox-macOS.entitlements

      # 9. 解析 SPM 依赖包 (VLCKitSPM)
      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project tvbox.xcodeproj \
            -scheme "tvbox"

      # 10. 执行归档编译
      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme "tvbox" \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/TVBox.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=targeted \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO | xcbeautify

      # 11. 上传编译产物暂存
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tvbox-xcarchive
          path: ${{ runner.temp }}/TVBox.xcarchive
          retention-days: 1
